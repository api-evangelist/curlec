aid: curlec
name: Curlec
description: >-
  Curlec (Razorpay Curlec) is a Malaysian online payment solution and part of Razorpay,
  the RBI-authorised full-stack payment platform. Curlec lets businesses in Malaysia accept
  one-time and recurring payments through a Payment Gateway, Payment Links, Payment Pages,
  Payment Buttons, hosted Checkout, DuitNow real-time payments, FPX online banking, cards
  and e-wallets, plus Subscriptions and direct-debit recurring billing. It runs on the shared
  Razorpay REST API (https://api.razorpay.com/v1) — a RESTful, JSON, Basic-Auth API covering
  Orders, Payments, Refunds, Settlements, Disputes, Customers, Invoices, Plans, Subscriptions,
  Payment Links, QR Codes, Virtual Accounts, Transfers/Route, and the RazorpayX business-banking
  and payouts suite. Curlec exposes official server SDKs, webhooks, a sandbox test mode, a public
  Postman workspace, and an official hosted MCP server for AI-agent access.
url: https://raw.githubusercontent.com/api-evangelist/curlec/refs/heads/main/apis.yml
